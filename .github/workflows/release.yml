name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,dev]"

      - name: Test the tagged source
        run: python -m pytest

      - name: Run installed console-script smoke test
        run: |
          sharesafe --version
          sharesafe doctor --json
          sharesafe self-test --json

      - name: Run bundled CLI smoke test
        run: |
          python skills/sharesafe/scripts/run_sharesafe.py doctor --json
          python skills/sharesafe/scripts/run_sharesafe.py self-test --json

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check out the official OpenAI Skill validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .openai-skills
          sparse-checkout: skills/.system/skill-creator/scripts
          persist-credentials: false

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" wheel ".[full,dev]" twine PyYAML

      - name: Test the tagged source and validate the Skill
        run: |
          python -m pytest
          python .openai-skills/skills/.system/skill-creator/scripts/quick_validate.py skills/sharesafe

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python .github/scripts/check_release_artifacts.py dist --tag "${GITHUB_REF_NAME}"

      - name: Rebuild a wheel from the source distribution
        run: |
          mkdir -p "${RUNNER_TEMP}/from-sdist"
          cp dist/*.tar.gz "${RUNNER_TEMP}/from-sdist/"
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "${RUNNER_TEMP}/from-sdist" dist/*.tar.gz
          python .github/scripts/check_release_artifacts.py "${RUNNER_TEMP}/from-sdist" --tag "${GITHUB_REF_NAME}"

      - name: Install wheel in an isolated environment and smoke-test the CLI
        run: |
          smoke_env="${RUNNER_TEMP}/sharesafe-release-smoke"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "${smoke_env}/bin/python" -m pip check
          "${smoke_env}/bin/sharesafe" --version
          "${smoke_env}/bin/python" -m sharesafe doctor --json
          "${smoke_env}/bin/python" -m sharesafe self-test --json
          "${smoke_env}/bin/python" -m sharesafe scan README.md --json

      - name: Install the wheel rebuilt from the source distribution
        run: |
          smoke_env="${RUNNER_TEMP}/sharesafe-release-sdist-smoke"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install --no-index --no-deps "${RUNNER_TEMP}/from-sdist/"*.whl
          "${smoke_env}/bin/python" -m pip check
          "${smoke_env}/bin/sharesafe" --version
          "${smoke_env}/bin/python" -m sharesafe doctor --json
          "${smoke_env}/bin/python" -m sharesafe self-test --json
          "${smoke_env}/bin/python" -m sharesafe scan README.md --json

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "ShareSafe ${GITHUB_REF_NAME}"
